[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "SAMEORIGIN"

[[headers]]
for = "/admin/*"
  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  Content-Security-Policy = """
    default-src 'self' https://identity.tinajs.io https://tinaxgatsby.netlify.app;
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.tinajs.io;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    connect-src 'self' https://identity.tinajs.io https://api.tina.io;
    frame-src 'self' https://identity.tinajs.io;
    frame-ancestors 'self';
  """